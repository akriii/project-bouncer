services:
  redis:
    image: redis:alpine
    container_name: bouncer-redis
    ports:
      - "6379:6379"
    networks:
      - bouncer-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: bouncer-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - REDIS_URL=redis://redis:6379
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bouncer-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: bouncer-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - bouncer-net
    restart: unless-stopped

networks:
  bouncer-net:
    driver: bridge