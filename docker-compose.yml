version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    # REMOVED: ports: ["8000:8000"] - Traffic must now go through Nginx
    environment:
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=super_secret_jwt_key_bouncer_2026
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=secure_admin_password_2026
    deploy:
      replicas: 3 # Spins up Backend A, Backend B, and Backend C

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80" # Nginx takes over port 8000
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend