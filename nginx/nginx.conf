# C:\Projects\Bouncer\nginx\nginx.conf

events {
    worker_connections 1024;
}

http {
    upstream bouncer_cluster {
        # Docker's internal DNS automatically resolves "backend" to all running replicas
        server backend:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://bouncer_cluster;
            
            # Critical headers for WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Pass original client IP to FastAPI
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Prevent Nginx from timing out idle queue connections
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}